services:
  - type: web
    name: emr-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free                  # free tier while testing; upgrade to 'starter' for production
    region: frankfurt           # closest to Nigeria
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: STORAGE_BACKEND
        value: cloudinary
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false